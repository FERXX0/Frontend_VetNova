<div class="user-menu" [class.user-menu--abierto]="abierto()">
  <button
    type="button"
    class="user-menu__trigger"
    (click)="toggleDropdown()"
    aria-haspopup="true"
    [attr.aria-expanded]="abierto()"
    title="Menú de usuario"
  >
    <div class="user-menu__avatar">
      @if (fotoUrl) {
        <img [src]="fotoUrl" [alt]="usuario()?.nombre || 'Usuario'" class="user-menu__avatar-img" />
      } @else {
        <span class="user-menu__avatar-iniciales">{{ iniciales() }}</span>
      }
    </div>

    <div class="user-menu__meta">
      <span class="user-menu__nombre">{{ usuario()?.nombre || 'Usuario' }}</span>
      <span class="user-menu__rol">{{ usuario()?.rol?.nombre || 'Rol' }}</span>
    </div>

    <svg class="user-menu__chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  @if (abierto()) {
    <div class="user-menu__dropdown" role="menu">
      <div class="user-menu__header">
        <div class="user-menu__header-avatar">
          @if (fotoUrl) {
            <img [src]="fotoUrl" [alt]="usuario()?.nombre || 'Usuario'" />
          } @else {
            <span>{{ iniciales() }}</span>
          }
        </div>
        <div class="user-menu__header-info">
          <strong class="user-menu__header-nombre">{{ usuario()?.nombre }}</strong>
          <span class="user-menu__header-correo">{{ usuario()?.correo }}</span>
          <span class="user-menu__header-rol-badge">{{ usuario()?.rol?.nombre }}</span>
          @if (!esSuperAdmin() && usuario()?.empresa?.nombre) {
            <span class="user-menu__header-empresa">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 21h18M5 21V7l8-4v18M13 7l6 3v11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              {{ usuario()?.empresa?.nombre }}
            </span>
          }
        </div>
      </div>

      <div class="user-menu__divider"></div>

      <div class="user-menu__items">
        <button type="button" class="user-menu__item" (click)="irAPerfil()" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Mi Perfil / Configuración</span>
        </button>

        <div class="user-menu__divider"></div>

        <button type="button" class="user-menu__item user-menu__item--logout" (click)="cerrarSesion()" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Cerrar sesión</span>
        </button>
      </div>
    </div>
  }
</div>
